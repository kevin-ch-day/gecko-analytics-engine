[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gecko-analytics-engine"
version = "0.1.0"
description = "Python research and analytics engine for Project Gecko."
requires-python = ">=3.11"
dependencies = [
    "mysql-connector-python>=9.0",
]

[tool.setuptools.packages.find]
include = ["gecko_analytics_engine*"]
